<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img class="brand-mark" src="{{ `images/logo.svg` | relURL }}" width="32" height="32" alt="">
      <span class="brand-name">Speakeasy</span>
    </a>
    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      {{ $isDocs := eq .Section "docs" }}
      <a href="{{ `docs/` | relURL }}"{{ if $isDocs }} aria-current="page"{{ end }}>Docs</a>
      <a href="{{ site.Params.github }}" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>
