{{ define "main" }}
<article class="page-wrap">
  <header class="page-intro">
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ if .Pages }}
  <ul class="page-list">
    {{ range .Pages.ByWeight }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.lead }}<p>{{ . }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}
