<section class="section how">
  <div class="section-inner">
    {{ partial "home/section-head.html" . }}
    <ol class="steps">
      {{ range .RegularPages.ByWeight }}
      <li>
        <h3>{{ .Title }}</h3>
        {{ .Content }}
      </li>
      {{ end }}
    </ol>
    {{ with .Content }}
    <div class="how-note">{{ . }}</div>
    {{ end }}
  </div>
</section>
