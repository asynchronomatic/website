baseURL = "https://asynchronomatic.github.io/SpeakeasyHugo/"
languageCode = "en-us"
title = "Asynchromatic"
enableGitInfo = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "AI at scale, without the big guys. Software so a group can run intelligence on machines they already own."
  tagline = "AI at scale, without the big guys."
  github = "https://github.com/asynchronomatic/speakeasy"
  githubOrg = "https://github.com/asynchronomatic"
  org = "Asynchromatic"
  defaultListen = ":4080"
  adminPort = 4002
  relayPort = 4001

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  guessSyntax = true
  tabWidth = 2

