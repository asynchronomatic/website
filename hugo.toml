baseURL = "https://asynchronomatic.github.io/SpeakeasyHugo/"
languageCode = "en-us"
title = "Speakeasy"
enableGitInfo = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Share local Ollama models with a private group over a libp2p mesh, behind one OpenAI- and Ollama-compatible HTTP endpoint."
  tagline = "Share local Ollama models with a private group, behind one OpenAI-compatible endpoint."
  github = "https://github.com/asynchronomatic/speakeasy"
  org = "Asynchronomatic"
  defaultListen = ":4080"
  adminPort = 4002
  relayPort = 4001

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  guessSyntax = true
  tabWidth = 2

[[menus.main]]
  name = "Docs"
  pageRef = "/docs/"
  weight = 10
